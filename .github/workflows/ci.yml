name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


env:
  GO_VERSION: "1.22"
  LLAMA_SUBMODULE_SHA: "9e3b928fd8c9d14dbf15a8768b9fdd7e5c721d66"
  LLAMA_SUBMODULE_TAG: "b9553"
  CI_GGUF_FILENAME: "smollm2-135m-instruct-q4_k_m.gguf"
  CI_GGUF_URL: "https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
  CI_GGUF_CACHE_KEY: "smollm2-135m-instruct-q4_k_m-v1"
  LLAMA_BUILD_CACHE_KEY: "llama-cpu-b9553-ubuntu-portable-v2"
  # Portable CPU baseline for cached libllama.so (no -march=native / AVX-512).
  LLAMA_CMAKE_PORTABLE: "-DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF"
  CI_MIN_INTEGRATION_PASSES_LLAMA: "5"
  CI_MIN_INTEGRATION_PASSES_RUNTIME: "1"
  CI_GGUF_SHA256_FILE: "testdata/ci/smollm2-135m-instruct-q4_k_m.gguf.sha256"
  CI_MODEL_MAX_BYTES: "262144000"


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        id: go-test
        env:
          CGO_ENABLED: "0"
        run: |
          source .github/scripts/ci-emit-metrics.sh
          START=$(tb_ci_now)
          go test ./...
          END=$(tb_ci_now)
          tb_ci_env_set TB_GO_TEST_DURATION_S "$((END-START))"
      - name: Emit CI job metrics
        if: always()
        continue-on-error: true
        env:
          JOB_NAME: test
          JOB_CONCLUSION: ${{ job.status }}
          SETUP_GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}
          STEP_GO_TEST: ${{ steps.go-test.outcome }}
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_SETUP_GO_CACHE "$(tb_ci_cache_label "$SETUP_GO_CACHE_HIT")"
          tb_ci_emit_job_summary
      - name: Upload CI job metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-test
          path: ${{ runner.temp }}/ci-job-metrics.json
          if-no-files-found: warn


  inference-cgo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Build llama.cpp (CPU, libraries only)
        id: build-llama
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_LLAMA_BUILD_CACHE miss
          START=$(tb_ci_now)
          cmake -S third_party/llama.cpp -B third_party/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            $LLAMA_CMAKE_PORTABLE \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_HIP=OFF \
            -DGGML_CCACHE=OFF
          cmake --build third_party/llama.cpp/build --target llama -j"$(nproc)"
          test -f third_party/llama.cpp/build/bin/libllama.so
          END=$(tb_ci_now)
          tb_ci_env_set TB_LLAMA_BUILD_DURATION_S "$((END-START))"
      - name: Test inference package (CGO CPU)
        id: cgo-test
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/llama.cpp/build/bin
        run: |
          source .github/scripts/ci-emit-metrics.sh
          START=$(tb_ci_now)
          go test ./internal/inference/llama/...
          END=$(tb_ci_now)
          tb_ci_env_set TB_CGO_TEST_DURATION_S "$((END-START))"
      - name: Emit CI job metrics
        if: always()
        continue-on-error: true
        env:
          JOB_NAME: inference-cgo
          JOB_CONCLUSION: ${{ job.status }}
          SETUP_GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}
          STEP_BUILD_LLAMA: ${{ steps.build-llama.outcome }}
          STEP_CGO_TEST: ${{ steps.cgo-test.outcome }}
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_SETUP_GO_CACHE "$(tb_ci_cache_label "$SETUP_GO_CACHE_HIT")"
          tb_ci_emit_job_summary
      - name: Upload CI job metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-inference-cgo
          path: ${{ runner.temp }}/ci-job-metrics.json
          if-no-files-found: warn


  inference-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify llama.cpp submodule SHA
        id: verify-submodule-sha
        run: |
          cd third_party/llama.cpp
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$LLAMA_SUBMODULE_SHA" ]; then
            echo "Submodule SHA mismatch: got $actual want $LLAMA_SUBMODULE_SHA"
            exit 1
          fi
      - name: Verify llama.cpp upstream tag
        id: verify-submodule-tag
        run: |
          cd third_party/llama.cpp
          git fetch --tags --force origin 2>/dev/null || true
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ "$tag" != "$LLAMA_SUBMODULE_TAG" ]; then
            echo "Submodule tag mismatch: got '${tag:-none}' want '$LLAMA_SUBMODULE_TAG'"
            exit 1
          fi
      - name: Read GGUF SHA256 from repository
        id: read-gguf-sha256
        run: |
          if [ ! -f "$CI_GGUF_SHA256_FILE" ]; then
            echo "Missing checksum file: $CI_GGUF_SHA256_FILE"
            exit 1
          fi
          CI_GGUF_SHA256=$(tr -d '[:space:]' < "$CI_GGUF_SHA256_FILE")
          if [ ${#CI_GGUF_SHA256} -ne 64 ]; then
            echo "Invalid SHA256 in $CI_GGUF_SHA256_FILE"
            exit 1
          fi
          echo "CI_GGUF_SHA256=$CI_GGUF_SHA256" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Restore llama.cpp build cache
        id: llama-build-cache
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp/build
          key: ${{ env.LLAMA_BUILD_CACHE_KEY }}-${{ env.LLAMA_SUBMODULE_SHA }}
      - name: Build llama.cpp (CPU, libraries only)
        id: build-llama
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_LLAMA_CACHE_KEY "${LLAMA_BUILD_CACHE_KEY}-${LLAMA_SUBMODULE_SHA}"
          tb_ci_env_set TB_GGUF_CACHE_KEY "${CI_GGUF_CACHE_KEY}"
          if [ -f third_party/llama.cpp/build/bin/libllama.so ]; then
            echo "llama.cpp build cache hit"
            tb_ci_env_set TB_LLAMA_BUILD_CACHE hit
            tb_ci_env_set TB_LLAMA_BUILD_DURATION_S 0
            exit 0
          fi
          tb_ci_env_set TB_LLAMA_BUILD_CACHE miss
          START=$(tb_ci_now)
          cmake -S third_party/llama.cpp -B third_party/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            $LLAMA_CMAKE_PORTABLE \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_HIP=OFF \
            -DGGML_CCACHE=OFF
          cmake --build third_party/llama.cpp/build --target llama -j"$(nproc)"
          test -f third_party/llama.cpp/build/bin/libllama.so
          END=$(tb_ci_now)
          tb_ci_env_set TB_LLAMA_BUILD_DURATION_S "$((END-START))"
      - name: Restore GGUF model cache
        uses: actions/cache@v4
        id: gguf-cache
        with:
          path: ${{ runner.temp }}/tb-ci-models
          key: ${{ env.CI_GGUF_CACHE_KEY }}-${{ hashFiles('testdata/ci/smollm2-135m-instruct-q4_k_m.gguf.sha256') }}
      - name: Download GGUF model if missing
        id: download-gguf
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_GGUF_CACHE "$(tb_ci_cache_label '${{ steps.gguf-cache.outputs.cache-hit }}')"
          MODEL_DIR="${{ runner.temp }}/tb-ci-models"
          MODEL_PATH="${MODEL_DIR}/${CI_GGUF_FILENAME}"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL_PATH" ]; then
            tb_ci_env_set TB_GGUF_DOWNLOAD_DURATION_S 0
          else
            START=$(tb_ci_now)
            curl -fsSL -o "$MODEL_PATH" "$CI_GGUF_URL"
            END=$(tb_ci_now)
            tb_ci_env_set TB_GGUF_DOWNLOAD_DURATION_S "$((END-START))"
          fi
          test -f "$MODEL_PATH"
      - name: Verify GGUF SHA256
        id: verify-gguf-sha256
        run: |
          source .github/scripts/ci-emit-metrics.sh
          START=$(tb_ci_now)
          MODEL_DIR="${{ runner.temp }}/tb-ci-models"
          MODEL_PATH="${MODEL_DIR}/${CI_GGUF_FILENAME}"
          echo "${CI_GGUF_SHA256}  ${MODEL_PATH}" | sha256sum -c -
          END=$(tb_ci_now)
          tb_ci_env_set TB_GGUF_VERIFY_DURATION_S "$((END-START))"
      - name: Assert GGUF model size
        id: assert-gguf-size
        run: |
          MODEL_DIR="${{ runner.temp }}/tb-ci-models"
          MODEL_PATH="${MODEL_DIR}/${CI_GGUF_FILENAME}"
          size=$(stat -c%s "$MODEL_PATH")
          if [ "$size" -gt "$CI_MODEL_MAX_BYTES" ]; then
            echo "Model too large: ${size} bytes (max ${CI_MODEL_MAX_BYTES})"
            exit 1
          fi
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          echo "TB_TEST_GGUF_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/third_party/llama.cpp/build/bin" >> "$GITHUB_ENV"
      - name: Run llama integration tests (M1 + M2)
        id: llama-integration-tests
        env:
          CGO_ENABLED: "1"
          JSON_OUT: ${{ runner.temp }}/go-test-llama.json
          MIN_PASS: ${{ env.CI_MIN_INTEGRATION_PASSES_LLAMA }}
        run: |
          source .github/scripts/ci-emit-metrics.sh
          set -euo pipefail
          TB_TEST_START=$(tb_ci_now)
          set +e
          go test -json -tags integration -count=1 ./internal/inference/llama/... > "$JSON_OUT"
          GO_EXIT=$?
          set -e
          export GO_EXIT
          python3 <<'PY'
          import json, os, sys
          path = os.environ["JSON_OUT"]
          min_pass = int(os.environ["MIN_PASS"])
          go_exit = int(os.environ.get("GO_EXIT", "0"))
          pass_count = skip_count = run_count = fail_count = 0
          fail_entries = []
          output_entries = []
          with open(path, encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  action = ev.get("Action")
                  if action == "fail" and len(fail_entries) < 50:
                      fail_entries.append(ev)
                  elif action == "output" and len(output_entries) < 50:
                      output_entries.append(ev)
                  if not ev.get("Test"):
                      continue
                  if action == "pass":
                      pass_count += 1
                  elif action == "skip":
                      skip_count += 1
                  elif action == "run":
                      run_count += 1
                  elif action == "fail":
                      fail_count += 1
          def write_env(k, v):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")
          write_env("TB_M2_PASS_COUNT", pass_count)
          write_env("TB_M2_RUN_COUNT", run_count)
          write_env("TB_M2_SKIP_COUNT", skip_count)
          write_env("TB_M2_FAIL_COUNT", fail_count)
          errors = []
          if run_count == 0:
              errors.append("test run count is 0")
          if skip_count > 0:
              errors.append(f"skip count {skip_count} > 0")
          if pass_count < min_pass:
              errors.append(f"pass count {pass_count} < {min_pass}")
          if errors:
              write_env("TB_M2_GUARD_FAILED", "1")
              if pass_count < min_pass:
                  write_env("TB_FAILURE_CLASS", "pass_count_low")
              print("; ".join(errors), file=sys.stderr)
              print("M2 diagnostics:", file=sys.stderr)
              print(f"  pass_count={pass_count}", file=sys.stderr)
              print(f"  run_count={run_count}", file=sys.stderr)
              print(f"  skip_count={skip_count}", file=sys.stderr)
              print(f"  fail_count={fail_count}", file=sys.stderr)
              print(f"  go test exit code={go_exit}", file=sys.stderr)
              print("  first Action:\"fail\" entries:", file=sys.stderr)
              for i, ev in enumerate(fail_entries):
                  print(f"    [{i}] {json.dumps(ev, ensure_ascii=True)}", file=sys.stderr)
              print("  first Action:\"output\" entries:", file=sys.stderr)
              for i, ev in enumerate(output_entries):
                  print(f"    [{i}] {json.dumps(ev, ensure_ascii=True)}", file=sys.stderr)
                  out = ev.get("Output", "")
                  if "SIGILL" in out:
                      write_env("TB_FAILURE_CLASS", "SIGILL")
              sys.exit(1)
          write_env("TB_M2_GUARD_FAILED", "0")
          print(f"integration summary: pass={pass_count} skip={skip_count} run={run_count}", file=sys.stderr)
          PY
          TB_TEST_END=$(tb_ci_now)
          tb_ci_env_set TB_INTEGRATION_TEST_DURATION_S "$((TB_TEST_END - TB_TEST_START))"
          if [ "$GO_EXIT" -ne 0 ]; then
            tb_ci_env_set TB_FAILURE_CLASS go_test_failed
            exit "$GO_EXIT"
          fi
          echo "integration summary: duration_s=$((TB_TEST_END - TB_TEST_START))"
      - name: Upload llama integration test JSON (failure)
        if: failure() && steps.llama-integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-test-llama-json-${{ github.run_id }}
          path: ${{ runner.temp }}/go-test-llama.json
          if-no-files-found: warn
          retention-days: 14
      - name: Emit CI job metrics
        if: always()
        continue-on-error: true
        env:
          JOB_NAME: inference-integration
          JOB_CONCLUSION: ${{ job.status }}
          SETUP_GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}
          STEP_VERIFY_SHA: ${{ steps.verify-submodule-sha.outcome }}
          STEP_VERIFY_TAG: ${{ steps.verify-submodule-tag.outcome }}
          STEP_READ_SHA256: ${{ steps.read-gguf-sha256.outcome }}
          STEP_BUILD_LLAMA: ${{ steps.build-llama.outcome }}
          STEP_DOWNLOAD_GGUF: ${{ steps.download-gguf.outcome }}
          STEP_VERIFY_GGUF: ${{ steps.verify-gguf-sha256.outcome }}
          STEP_ASSERT_GGUF: ${{ steps.assert-gguf-size.outcome }}
          STEP_INTEGRATION_TEST: ${{ steps.llama-integration-tests.outcome }}
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_SETUP_GO_CACHE "$(tb_ci_cache_label "$SETUP_GO_CACHE_HIT")"
          tb_ci_emit_job_summary
      - name: Upload CI job metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-inference-integration
          path: ${{ runner.temp }}/ci-job-metrics.json
          if-no-files-found: warn


  inference-integration-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify llama.cpp submodule SHA
        id: verify-submodule-sha
        run: |
          cd third_party/llama.cpp
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$LLAMA_SUBMODULE_SHA" ]; then
            echo "Submodule SHA mismatch: got $actual want $LLAMA_SUBMODULE_SHA"
            exit 1
          fi
      - name: Verify llama.cpp upstream tag
        id: verify-submodule-tag
        run: |
          cd third_party/llama.cpp
          git fetch --tags --force origin 2>/dev/null || true
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ "$tag" != "$LLAMA_SUBMODULE_TAG" ]; then
            echo "Submodule tag mismatch: got '${tag:-none}' want '$LLAMA_SUBMODULE_TAG'"
            exit 1
          fi
      - name: Read GGUF SHA256 from repository
        id: read-gguf-sha256
        run: |
          if [ ! -f "$CI_GGUF_SHA256_FILE" ]; then
            echo "Missing checksum file: $CI_GGUF_SHA256_FILE"
            exit 1
          fi
          CI_GGUF_SHA256=$(tr -d '[:space:]' < "$CI_GGUF_SHA256_FILE")
          if [ ${#CI_GGUF_SHA256} -ne 64 ]; then
            echo "Invalid SHA256 in $CI_GGUF_SHA256_FILE"
            exit 1
          fi
          echo "CI_GGUF_SHA256=$CI_GGUF_SHA256" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Restore llama.cpp build cache
        id: llama-build-cache
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp/build
          key: ${{ env.LLAMA_BUILD_CACHE_KEY }}-${{ env.LLAMA_SUBMODULE_SHA }}
      - name: Build llama.cpp (CPU, libraries only)
        id: build-llama
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_LLAMA_CACHE_KEY "${LLAMA_BUILD_CACHE_KEY}-${LLAMA_SUBMODULE_SHA}"
          tb_ci_env_set TB_GGUF_CACHE_KEY "${CI_GGUF_CACHE_KEY}"
          if [ -f third_party/llama.cpp/build/bin/libllama.so ]; then
            echo "llama.cpp build cache hit"
            tb_ci_env_set TB_LLAMA_BUILD_CACHE hit
            tb_ci_env_set TB_LLAMA_BUILD_DURATION_S 0
            exit 0
          fi
          tb_ci_env_set TB_LLAMA_BUILD_CACHE miss
          START=$(tb_ci_now)
          cmake -S third_party/llama.cpp -B third_party/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            $LLAMA_CMAKE_PORTABLE \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_HIP=OFF \
            -DGGML_CCACHE=OFF
          cmake --build third_party/llama.cpp/build --target llama -j"$(nproc)"
          test -f third_party/llama.cpp/build/bin/libllama.so
          END=$(tb_ci_now)
          tb_ci_env_set TB_LLAMA_BUILD_DURATION_S "$((END-START))"
      - name: Restore GGUF model cache
        uses: actions/cache@v4
        id: gguf-cache
        with:
          path: ${{ runner.temp }}/tb-ci-models
          key: ${{ env.CI_GGUF_CACHE_KEY }}-${{ hashFiles('testdata/ci/smollm2-135m-instruct-q4_k_m.gguf.sha256') }}
      - name: Download GGUF model if missing
        id: download-gguf
        run: |
          source .github/scripts/ci-emit-metrics.sh
          tb_ci_env_set TB_GGUF_CACHE "$(tb_ci_cache_label '${{ steps.gguf-cache.outputs.cache-hit }}')"
