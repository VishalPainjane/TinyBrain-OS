          echo "LD_LIBRARY_PATH=${{ github.workspace }}/third_party/llama.cpp/build/bin" >> "$GITHUB_ENV"
      - name: Run runtime integration tests (M1 + M2)
        id: runtime-integration-tests
        env:
          CGO_ENABLED: "1"
          JSON_OUT: ${{ runner.temp }}/go-test-runtime.json
          MIN_PASS: ${{ env.CI_MIN_INTEGRATION_PASSES_RUNTIME }}
        run: |
          source .github/scripts/ci-emit-metrics.sh
