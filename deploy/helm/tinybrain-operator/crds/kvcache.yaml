apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kvcaches.memory.tinybrain.io
spec:
  group: memory.tinybrain.io
  names:
    kind: KVCache
    plural: kvcaches
    singular: kvcache
    shortNames:
      - kvc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ownerRef:
                  type: string
                maxSize:
                  type: string
            status:
              type: object
              properties:
                currentSize:
                  type: string
                location:
                  type: string
