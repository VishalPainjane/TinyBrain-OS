apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: swappolicies.memory.tinybrain.io
spec:
  group: memory.tinybrain.io
  names:
    kind: SwapPolicy
    plural: swappolicies
    singular: swappolicy
    shortNames:
      - swp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vramThreshold:
                  type: string
                ramThreshold:
                  type: string
                strategy:
                  type: string
            status:
              type: object
              properties:
                active:
                  type: boolean
