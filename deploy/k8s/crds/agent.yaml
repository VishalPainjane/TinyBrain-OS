apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.core.tinybrain.io
spec:
  group: core.tinybrain.io
  names:
    kind: Agent
    plural: agents
    singular: agent
    shortNames:
      - agt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                model:
                  type: string
                plugin:
                  type: string
                systemPrompt:
                  type: string
                resources:
                  type: object
                  properties:
                    maxVram:
                      type: string
            status:
              type: object
              properties:
                state:
                  type: string
                modelLoaded:
                  type: boolean
